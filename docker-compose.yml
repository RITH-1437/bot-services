# Long-running Telegram bot. No database, no cache, no extra services.
#
#   cp .env.example .env      # then paste TELEGRAM_BOT_TOKEN into .env
#   docker compose up -d --build
#   docker compose logs -f
#
services:
  bot:
    build: .
    image: twbrothers-welcome-bot:latest
    container_name: twbrothers-welcome-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Only needed for RUN_MODE=webhook:
